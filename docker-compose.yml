version: '3.8'

services:
  tesla-proxy:
    image: tesla/vehicle-command:latest
    container_name: tesla-http-proxy
    ports:
      - "4443:4443"
    volumes:
      - ./config:/config
    environment:
      - TESLA_HTTP_PROXY_TLS_CERT=/config/tls-cert.pem
      - TESLA_HTTP_PROXY_TLS_KEY=/config/tls-key.pem
      - TESLA_HTTP_PROXY_HOST=0.0.0.0
      - TESLA_HTTP_PROXY_PORT=4443
      - TESLA_HTTP_PROXY_TIMEOUT=30s
      - TESLA_VERBOSE=true
    command: >
      -tls-key /config/tls-key.pem
      -cert /config/tls-cert.pem
      -key-file /config/fleet-key.pem
      -host 0.0.0.0
      -port 4443
    healthcheck:
      test: ["CMD", "curl", "-f", "--cacert", "/config/tls-cert.pem", "https://localhost:4443/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - tesla-network

  tesla-api:
    build: .
    image: tesla-fleet-api-service:latest
    container_name: tesla-api
    depends_on:
      tesla-proxy:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "8080:8080"  # callback OAuth Tesla configurato in TESLA_REDIRECT_URI
    volumes:
      - ./.env:/app/.env:ro
      - ./tesla-tokens.json:/app/tesla-tokens.json
    environment:
      - TESLA_API_LISTEN_ADDR=:8000
      - TESLA_PROXY_URL=https://tesla-proxy:4443
      - TESLA_TOKEN_PATH=/app/tesla-tokens.json
      - TESLA_RESET_TOKEN_ON_START=true
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_ORG=tesla
      - INFLUX_BUCKET=vehicle
      - INFLUX_TOKEN=${INFLUX_ADMIN_TOKEN:-tesla-dev-token-change-me}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    networks:
      - tesla-network

  influxdb:
    image: influxdb:2
    container_name: tesla-influxdb
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb-data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_ADMIN_USER:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_ADMIN_PASSWORD:-change-me-please}
      - DOCKER_INFLUXDB_INIT_ORG=tesla
      - DOCKER_INFLUXDB_INIT_BUCKET=vehicle
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_ADMIN_TOKEN:-tesla-dev-token-change-me}
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    networks:
      - tesla-network

  node-red:
    image: nodered/node-red:latest
    container_name: tesla-node-red
    depends_on:
      tesla-api:
        condition: service_healthy
    ports:
      - "1880:1880"
    volumes:
      - ./node-red-data:/data
    restart: unless-stopped
    networks:
      - tesla-network

  grafana:
    image: grafana/grafana-oss:latest
    container_name: tesla-grafana
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - INFLUX_TOKEN=${INFLUX_ADMIN_TOKEN:-tesla-dev-token-change-me}
    restart: unless-stopped
    networks:
      - tesla-network

networks:
  tesla-network:
    driver: bridge
